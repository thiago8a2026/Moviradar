name: moviradar
description: "MoviRadar - Aplicación móvil de movilidad ciudadana con OpenStreetMap, GPS en vivo, arquitectura limpia y BLoC."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management (BLoC Pattern)
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # Design & UI Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # Mapas y Geolocalización (100% Gratuitos / OpenStreetMap)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0

  # Autenticación Real (Firebase Spark - 100% Gratuito)
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8

  # Base de Datos en Tiempo Real (Cloud Firestore Spark - Plan Gratuito)
  cloud_firestore: ^4.15.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

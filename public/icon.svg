<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircle for mobile maskable safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle radar border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Radar concentric circles -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0ea5e9" stroke-opacity="0.18" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="3"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Radar sweep quarter circle -->
  <path d="M 256 256 L 256 66 A 190 190 0 0 1 446 256 Z" fill="url(#radarGrad)" fill-opacity="0.12"/>
  <line x1="256" y1="256" x2="446" y2="256" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Crosshair lines -->
  <line x1="46" y1="256" x2="466" y2="256" stroke="#334155" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="256" y1="46" x2="256" y2="466" stroke="#334155" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Core GPS Pin / Radar Node with glow -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="42" fill="#020617" stroke="url(#radarGrad)" stroke-width="6"/>
    <circle cx="256" cy="256" r="22" fill="url(#radarGrad)"/>
    <circle cx="256" cy="256" r="9" fill="#ffffff"/>
  </g>

  <!-- Blip markers -->
  <circle cx="340" cy="180" r="12" fill="#ef4444" opacity="0.9"/>
  <circle cx="340" cy="180" r="20" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.5"/>
  <circle cx="180" cy="330" r="9" fill="#f59e0b" opacity="0.85"/>
  <circle cx="330" cy="320" r="8" fill="#10b981" opacity="0.85"/>
</svg>
